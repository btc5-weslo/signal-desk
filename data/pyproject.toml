[project]
name = "signal-data"
version = "0.1.0"
description = "Market data ingestion, storage, and event-driven backtesting for the Signal app."
requires-python = ">=3.11"
dependencies = [
  "signal-shared",
  "ccxt>=4.4.0",
  "yfinance>=0.2.50",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16.0",
  "duckdb>=1.1",
  "pydantic>=2.6",
  "numpy>=2.0",
  "python-dateutil>=2.9",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "jsonschema>=4.0"]

[project.scripts]
signal-data = "signal_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "network: tests that hit live market-data APIs",
]

[tool.uv.sources]
signal-shared = { path = "../shared", editable = true }
