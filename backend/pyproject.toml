[project]
name = "signal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "redis>=5.0",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7",
  "signal-shared",
  "signal-data",
  "signal-quant",
  "arq>=0.28.0",
  "polars>=2.2.0",
  "pandas>=3.1.1",
  "pyarrow>=26.0.1",
  "httpx>=0.28.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "fakeredis>=2.41.0"]
[tool.uv.sources]
signal-shared = { path = "../shared", editable = true }
signal-data = { path = "../data", editable = true }
signal-quant = { path = "../quant", editable = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../data/src", "../quant"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
# B008: FastAPI Depends()/Query() in default arguments.
ignore = ["B008"]

